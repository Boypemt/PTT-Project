<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <title>Houndstooth — seamless tile</title>
  <!--
    The classic tooth: a square check with a 45-degree point off two opposite
    corners, so each tooth is four-pointed and its points meet the points of
    the next tooth tip to tip — the broken check. The points leave the repeat
    unit, so the tooth is drawn nine times, offset by one unit in each
    direction, inside a clip of the unit: what leaves one edge comes back on
    the opposite one and the tile has no seam.
  -->
  <defs>
    <g id="tooth">
      <path d="M0 0H70V70H0Z" fill="var(--c1, #4b2a4f)" />
      <g fill="var(--c2, #5a3458)">
        <path d="M70 35L105 105L35 70Z" />
        <path d="M0 35L-35-35L35 0Z" />
      </g>
    </g>
    <clipPath id="cell">
      <rect width="140" height="140" />
    </clipPath>
  </defs>
  <g clip-path="url(#cell)">
    <use href="#tooth" x="-140" y="-140" />
    <use href="#tooth" x="0" y="-140" />
    <use href="#tooth" x="140" y="-140" />
    <use href="#tooth" x="-140" y="0" />
    <use href="#tooth" x="0" y="0" />
    <use href="#tooth" x="140" y="0" />
    <use href="#tooth" x="-140" y="140" />
    <use href="#tooth" x="0" y="140" />
    <use href="#tooth" x="140" y="140" />
  </g>
</svg>

  <path d="M500 150C616 226 774 384 850 500C774 616 616 774 500 850C384 774 226 616 150 500C226 384 384 226 500 150Z" fill="none" stroke="#000" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="10 9" />

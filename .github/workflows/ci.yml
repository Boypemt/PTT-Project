name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # HUSKY=0 skips the `prepare` hook install, which has no job on CI.
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    # The image the screenshot baselines were made in. Its fonts and its
    # chromium are what `e2e/__screenshots__` was photographed with, so this
    # tag has to move together with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      # Chromium outgrows the 64MB /dev/shm a container gets by default.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # Builds the site and serves it with `vite preview` itself; see
      # playwright.config.ts.
      - name: Run the journeys
        run: npm run test:e2e

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
